		<script id="vertexShader" type="x-shader/x-vertex">
			#version 300 es
			precision highp float;

			vec4 quatFromVectors(vec3 a, vec3 b) {
				float dotProduct = dot(a, b);
				
				vec3 axis = normalize(cross(a, b));
				float angle = acos(dotProduct);
				float halfAngle = angle * 0.5;
				float s = sin(halfAngle);

				return vec4(axis.x * s, axis.y * s, axis.z * s, cos(halfAngle));
			}

			// Helper function to convert a 3x3 rotation matrix to a quaternion
			vec4 quatFromMat3(mat3 m) {
				float t = m[0][0] + m[1][1] + m[2][2];
				vec4 q;
				if (t > 0.0) {
					float root = sqrt(t + 1.0);
					q.w = 0.5 * root;
					root = 0.5 / root;
					q.x = (m[2][1] - m[1][2]) * root;
					q.y = (m[0][2] - m[2][0]) * root;
					q.z = (m[1][0] - m[0][1]) * root;
				} else {
					int i = 0;
					if (m[1][1] > m[0][0]) i = 1;
					if (m[2][2] > m[i][i]) i = 2;
					int j = (i + 1) % 3;
					int k = (j + 1) % 3;

					float root = sqrt(m[i][i] - m[j][j] - m[k][k] + 1.0);
					q[i] = 0.5 * root;
					root = 0.5 / root;
					q.w = (m[k][j] - m[j][k]) * root;
					q[j] = (m[j][i] + m[i][j]) * root;
					q[k] = (m[k][i] + m[i][k]) * root;
				}
				return q;
			}

			uniform vec3 uCameraPosition;
			uniform float time;     // Animation Time
			uniform float count;    // Total Instances
			uniform float uMaxCurves;    // Total Instances
			uniform sampler2D uCurveTexture; // can remove not used in this version 
			uniform sampler2D uCurveMetadataTexture;
			uniform sampler2D uSnakesTexture;
			uniform sampler2D uSnakesMetadataTexture; // can remove not used in this version 

			flat out int outState;
			out vec3 outPosition;
			out vec4 outQuaternion;
			in int inState;
			in int snakeId;
			in float snakePathLength;
			in float offsetInSnake;
			in vec3 inPosition;
			const float speed = 4.; // important note, too low speed will cause the quaternion calculation to fail
			const int MAX_SEGMENTS = 32;
			const vec3 defaultForward = vec3(0.0, 1.0, 0.0); // Or whatever your model's forward is

			void main(){
				int prevCurveId = inState;

				// float snakePathLength = texelFetch(uSnakesMetadataTexture, ivec2(0, snakeId), 0).x;
				float newTotalProgress = mod(offsetInSnake * snakePathLength + time * speed, snakePathLength);

				float foundCurveId = 0.;
				float newProgOnCurve = 0.;
				bool isFound = false;

				// Start searching from the last known segment index.
				int startSearchIndex = prevCurveId;

				// Search from the last segment to the end. This is the most likely place to find it.
				for (int i = startSearchIndex; i < MAX_SEGMENTS; i++) {
					vec4 segmentData = texelFetch(uSnakesTexture, ivec2(i, snakeId), 0);
					
					// If segment length is 0, it's the end of the path definition.
					if (segmentData.y == 0.0) {
						break;
					}

					float segmentEndCumulative = segmentData.z;
					if (newTotalProgress <= segmentEndCumulative) {
						float direction = segmentData.w;
						foundCurveId = segmentData.x;
						float segmentLength = segmentData.y;
						float segmentStart = segmentEndCumulative - segmentLength;
						float progressOnSegment = newTotalProgress - segmentStart;
						newProgOnCurve = direction > 0.0 ? progressOnSegment / segmentLength : 1.0 - progressOnSegment / segmentLength;
						isFound = true;
						break; // Found it! Exit loop.
					}
				}

				// If not found, it means the particle has looped back. Search from the beginning.
				if (!isFound) {
					for (int i = 0; i < startSearchIndex; i++) {
						vec4 segmentData = texelFetch(uSnakesTexture, ivec2(i, snakeId), 0);
						
						// An end-of-path marker should have been caught by the first loop.
						// If not, break to prevent incorrect calculations.
						if (segmentData.y == 0.0) {
							break;
						}
						
						float segmentEndCumulative = segmentData.z;
						if (newTotalProgress <= segmentEndCumulative) {
							float direction = segmentData.w;
							foundCurveId = segmentData.x;
							float segmentLength = segmentData.y;
							float segmentStart = segmentEndCumulative - segmentLength;
							float progressOnSegment = newTotalProgress - segmentStart;
							newProgOnCurve = direction > 0.0 ? progressOnSegment / segmentLength : 1.0 - progressOnSegment / segmentLength;
							isFound = true; // Not strictly needed, but good practice.
							break; // Found it! Exit loop.
						}
					}
				}

				float curveV = foundCurveId / uMaxCurves + 0.5 / uMaxCurves;
				float prog = newProgOnCurve; 
				
				vec3 prevPos = inPosition;
				vec2 nextPosUV = vec2(prog, curveV);
				vec3 nextPos = texture(uCurveTexture, nextPosUV).xyz;
				
				// --- CALCULATE QUATERNION ---
				// TODO implement cylindrical billboard to be able to use planes
				vec3 direction = normalize(nextPos - prevPos);
				
				// Check for NaN or zero-length direction (if prevPos == nextPos)
				outQuaternion = quatFromVectors(defaultForward, direction);

				outPosition = nextPos;
				outState = int(foundCurveId);
			}

		</script>

		<script id="vertexShaderParticles" type="x-shader/x-vertex">
			uniform sampler2D uCurveTexture;
			uniform sampler2D uSnakesMetadataTexture;
			attribute int snakeId;
			varying vec3 vColor;
			const float uMaxCurves = 5000.0; // Total number of curves
			void main(){
			    gl_PointSize = 10.;
				vColor = texelFetch(uSnakesMetadataTexture, ivec2(0, snakeId), 0).xyz;
				float foundCurveId = position.x;
				float curveV = foundCurveId / uMaxCurves + 0.5 / uMaxCurves;
				float prog = position.y;
				vec2 uv = vec2(prog, curveV);
			    vec4 curveData = texture(uCurveTexture, uv);
			    vec3 pos = curveData.xyz;
				gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
			}
		</script>

		<script id="fragmentShaderParticles" type="x-shader/x-fragment">
			varying vec3 vColor;
			uniform float uRadius;
			uniform float uThickness;
			uniform float uGlowBlurRadius;
			uniform float uGlowStartAlpha;

			// --- SDF Functions ---
			// Calculates the signed distance from a point 'p' to a circle of radius 'r'.
			// Negative inside, positive outside, zero on the edge.
			float sdCircle(vec2 p, float r) {
				return length(p) - r;
			}

			void main() {
				// Center the point's coordinate from (0,1) to (-0.5, 0.5)
				vec2 centeredPointCoord = gl_PointCoord - vec2(0.5);

				// Calculate a stable anti-aliasing width.
				float aa = fwidth(length(centeredPointCoord));

				// 1. SDF for the main circle and the outer edge of the entire shape.
				float circleSDF = sdCircle(centeredPointCoord, uRadius);
				float outerEdgeSDF = sdCircle(centeredPointCoord, uRadius + uThickness / 2.0);

				// 2. Define Colors
				vec3 ringColor = vec3(0.0, 0.0, 0.0);
				vec3 glowColor = vColor; // Use the particle's color for the glow.
				// The fill color includes a simple lighting gradient.
				vec2 lightDir = vec2(0.5, 0.5);
				float lightAmount = smoothstep(-0.5, 0.5, dot(centeredPointCoord, lightDir));
				vec3 fillColor = mix(vColor, vColor + 0.5, lightAmount);

				// 3. Calculate the Glow
				// The glow starts from the outer edge of the ring and fades outwards.
				float glowAlpha = (1.0 - smoothstep(0.0, uGlowBlurRadius, outerEdgeSDF)) * uGlowStartAlpha;
				vec4 glow = vec4(glowColor, 1.0) * glowAlpha;

				// 4. Calculate the Inner Shape (Fill + Ring)
				// Determine if the pixel is on the ring based on its distance from the circle SDF.
				float ringT = 1.0 - smoothstep((uThickness / 2.0) - aa, (uThickness / 2.0) + aa, abs(circleSDF));
				vec3 shapeColor = mix(fillColor, ringColor, ringT);

				// Determine the alpha for the main shape (the filled circle and its outline).
				float shapeAlpha = 1.0 - smoothstep(-aa, aa, outerEdgeSDF);
				vec4 shape = vec4(shapeColor, shapeAlpha);

				// 5. Blend the Shape on top of the Glow
				// We use the shape's alpha to mix it over the glow, which is in the background.
				// This correctly layers the opaque shape over the translucent glow.
				gl_FragColor = mix(glow, shape, shape.a);

				// Discard pixels that are fully transparent to optimize rendering.
				if (gl_FragColor.a < 0.01) discard;

				#include <colorspace_fragment>
			}
		</script>

		<script type="module">
			// #region IMPORTS & GLOBALS
			import * as THREE from "three";
			import WebGL from "three/addons/capabilities/WebGL.js";
			import { OrbitControls } from "three/addons/controls/OrbitControls.js";
			import Stats from "three/addons/libs/stats.module.js";

			const clock = new THREE.Clock();
			let container, stats;
			let camera, scene, renderer;

			const instCnt = 50;
			const particleCount = 10000; // Number of particles to simulate
			const snakeCounts = 5000;
			const max_segment_count = 32;
			const CURVE_COUNT = 5000;
			const POINTS_PER_CURVE = 50;
			const SPREAD_RANGE = 150; // The size of the area where curves will be generated
			let points;
			let instMesh;
			let feedback;
			let computeShader;
			let curveTexture;
			let curveMetadataTexture;
			let snakesTexture;

			let staticIdBuffer

			window.addEventListener("load", () => {

			/**
			 * Creates a smooth, teardrop-shaped BufferGeometry.
			 * The geometry is created with its pointy tip along the positive Y-axis.
			 * @returns {THREE.LatheGeometry}
			 */
			function createTeardropGeometry() {
				const TEARDROP_LENGTH = 3.4
				// Define a 2D profile with a rounded bottom and a sharp, tapered top.
				const points = [
					// Start at the center of the rounded bottom
					new THREE.Vector2(0, 0),
					// Curve outwards to create the "belly" of the drop
					new THREE.Vector2(0.5, 0.6),
					// Taper inwards towards the point
					new THREE.Vector2(0.2, 2.6),
					// End at the sharp tip
					new THREE.Vector2(0, TEARDROP_LENGTH),
				]

				// Create a smooth curve and generate vertices from it
				const curve = new THREE.SplineCurve(points)
				const curvePoints = curve.getPoints(20)

				// Create the 3D geometry by lathing the profile around the Y-axis
				const geometry = new THREE.LatheGeometry(curvePoints, 12)
				geometry.rotateZ(Math.PI) // Rotate to align the tip with the Y-axis

				// No rotation is needed. The shape is now correctly oriented by default.
				return geometry
			}
			// #endregion

			// #region THREEJS SETUP

			function init() {
				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				if (WebGL.isWebGL2Available() === false) {
					document.body.appendChild(WebGL.getWebGL2ErrorMessage());
					return;
				}

				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				container = document.getElementById("container");
				camera = new THREE.PerspectiveCamera(
					27,
					window.innerWidth / window.innerHeight,
					1,
					3500
				);
				camera.position.set(0, 5, 15);

				scene = new THREE.Scene();
				scene.background = new THREE.Color(0x3a3a3a);
				scene.fog = new THREE.Fog(0x050505, 2000, 3500);

				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				scene.add(new THREE.AmbientLight(0xcccccc));

				const light1 = new THREE.DirectionalLight(0xffffff, 1.5);
				light1.position.set(1, 1, 1);
				scene.add(light1);

				const light2 = new THREE.DirectionalLight(0xffffff, 4.5);
				light2.position.set(0, -1, 0);
				scene.add(light2);

				scene.add(new THREE.GridHelper(20, 20, 0x0c610c, 0x494949));

				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				renderer = new THREE.WebGLRenderer({ antialias: true });
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				container.appendChild(renderer.domElement);

				stats = new Stats();
				container.appendChild(stats.dom);

				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				const controls = new OrbitControls(camera, renderer.domElement);
				controls.target.set(0, 2.5, 0);
				controls.update();

				window.addEventListener("resize", onWindowResize);
				clock.start();
				initPrototype();
			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
			}

			// #endregion

			// #region RENDER LOOP
			function animate() {
				requestAnimationFrame(animate);
				compute(clock.getElapsedTime());
				render();
				stats.update();
			}

			function render() {
				renderer.render(scene, camera);
			}
			// #endregion

			// #region TRANFORM FEEDBACK
			let tf_readBuffer, tf_writeBuffer; // Buffers for ping-ponging

			function initPrototype() {
				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				// Create Instanced Mesh
				const geo = new THREE.BoxGeometry(1, 1, 1);
				const mat = new THREE.MeshPhongMaterial({ color: 0x00ff00 });

				instMesh = new THREE.InstancedMesh(geo, mat, instCnt);
				instMesh.position.set(0, 0, 0);
				instMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); // will be updated every frame

				const obj = new THREE.Object3D();
				for (let i = 0; i < instCnt; i++) {
					obj.position.set(3 + i, 0, 0);
					obj.updateMatrix();
					instMesh.setMatrixAt(i, obj.matrix);
				}

				instMesh.instanceMatrix.needsUpdate = true;
				instMesh.geometry.computeBoundingSphere();
				scene.add(instMesh);

				const geoPoints = new THREE.BufferGeometry();
				const positions = new Float32Array(particleCount * 3);
				for (let i = 0; i < particleCount; i++) {
					positions[i * 3 + 0] = 0;
					positions[i * 3 + 1] = Math.random(); // progression on the curve written by the tf
					positions[i * 3 + 2] = Math.random(); // random progress offset in world units within the snake
				}

				const particleIDs = new Int32Array(particleCount);
				for (let i = 0; i < particleCount; i++) {
					particleIDs[i] = Math.floor(Math.random() * snakeCounts); // random snake id
				}

				const offsetInSnake = new Float32Array(particleCount);
				for (let i = 0; i < particleCount; i++) {
					offsetInSnake[i] = Math.random(); // random offset within the snake
				}

				const snakePathLengths = new Float32Array(particleCount);

        		// const baseGeometry = createTeardropGeometry();
        		const baseGeometry = new THREE.PlaneGeometry(1, 1);
        		instancedGeometry = new THREE.InstancedBufferGeometry();
				instancedGeometry.copy(baseGeometry);
				instancedGeometry.instanceCount = particleCount;

				const instancePositions = new Float32Array(particleCount * 3);
        		const instanceQuaternions = new Float32Array(particleCount * 4);
        
				instancedGeometry.setAttribute('instancePosition', new THREE.InstancedBufferAttribute(instancePositions, 3));
        		instancedGeometry.setAttribute('instanceQuaternion', new THREE.InstancedBufferAttribute(instanceQuaternions, 4));

				const material = new THREE.ShaderMaterial({
					vertexShader: `
						precision highp float;

						varying vec2 vUv;

						// Our custom per-instance attributes!
						attribute vec3 instancePosition;
						attribute vec4 instanceQuaternion;

						// A helper function to apply quaternion rotation
						vec3 applyQuaternion(vec3 pos, vec4 q) {
							return pos + 2.0 * cross(q.xyz, cross(q.xyz, pos) + q.w * pos);
						}

						void main() {
							vUv = uv;

							// 1. First, determine the instance's unique "up" vector in world space.
							// We do this by rotating a standard up vector by the instance's quaternion.
							vec3 objectUp_world = applyQuaternion(vec3(0.0, 1.0, 0.0), instanceQuaternion);

							// 2. Get the direction from the instance to the camera.
							vec3 lookAt_world = cameraPosition - instancePosition;

							// 3. Project the lookAt vector onto the plane defined by objectUp_world.
							// This is the key step. It effectively "flattens" the camera direction
							// relative to the object's personal up-axis, not the world's.
							vec3 billboardForward = lookAt_world - dot(lookAt_world, objectUp_world) * objectUp_world;
							billboardForward = normalize(billboardForward);

							// 4. With our new 'forward' and original 'up', find the 'right' vector.
							vec3 billboardRight = normalize(cross(objectUp_world, billboardForward));

							// 5. Position the vertex in world space using these dynamic billboard axes.
							vec3 finalWorldPosition = instancePosition
													+ billboardRight * position.x
													+ objectUp_world * position.y
													+ billboardForward * position.z;

							// ----------------- END OF AXIAL BILLBOARD LOGIC -----------------

							// 6. Apply the standard view and projection matrices.
							gl_Position = projectionMatrix * viewMatrix * vec4(finalWorldPosition, 1.0);
						}
					`,
					fragmentShader: `
						precision highp float;

						// Receive the UV coordinates from the vertex shader
						varying vec2 vUv;

						float sdEgg( in vec2 p, in float ra, in float rb )
						{
							const float k = sqrt(3.0);
							p.x = abs(p.x);
							float r = ra - rb;
							return ((p.y<0.0)      ? length(vec2(p.x,  p.y    )) - r :
								(k*(p.x+r)<p.y) ? length(vec2(p.x,  p.y-k*r)) :
													length(vec2(p.x+r,p.y    )) - 2.0*r) - rb;
						}

						void main() {
							// Center the coordinates (from [0,1] range to [-0.5, 0.5])
							// This places the origin (0,0) at the center of our plane
							vec2 p = vUv - 0.5;

							// Calculate the signed distance from the current pixel to the egg's edge.
							// Adjust the radii (0.25, 0.2) to change the egg's shape and size.
							float distance = sdEgg(p, 0.25, 0.01);

							// Use smoothstep to create a soft, anti-aliased edge.
							// This creates a smooth transition from alpha 1.0 to 0.0
							// The third parameter (0.01) controls the softness of the border.
							float alpha = 1.0 - smoothstep(-0.01, 0.01, distance);

							// If the pixel is fully transparent, discard it.
							// This is an optimization that can improve performance.
							if (alpha < 0.05) {
								discard;
							}

							// Output the final color with the calculated alpha for transparency.
							gl_FragColor = vec4(0.2, 0.6, 1.0, alpha);
						}
					`
				});


				// ## 4. Create a Standard Mesh ##
				// ---------------------------------------------
				// Instead of an InstancedMesh, we create a regular Mesh.
				// THREE.js sees that we're using an InstancedBufferGeometry and
				// automatically enables instanced drawing for us. 💡
				const mesh = new THREE.Mesh(instancedGeometry, material);
				scene.add(mesh);
				// curve generation region
				// ## 2. Curve Generation
				// This is the core logic for creating the random curves.

				// A Float32Array to hold all our data (width * height * 4 channels)
				const textureData = new Float32Array(
					CURVE_COUNT * POINTS_PER_CURVE * 4
				);

				// A Float32Array to hold all our data (width * height * 4 channels)
				const curveMetadataTextureData = new Float32Array(CURVE_COUNT * 4);

				// A Float32Array to hold all our data (width * height * 4 channels)
				const snakePathsCurveMetadataTextureData = new Float32Array(
					snakeCounts * 4 * max_segment_count
				);

				const snakesMetadata = new Float32Array(
					snakeCounts * 4
				);

				// A helper function to generate a random 3D point within the range
				function getRandomPoint() {
					const x = (Math.random() - 0.5) * SPREAD_RANGE;
					const y = (Math.random() - 0.5) * SPREAD_RANGE;
					const z = (Math.random() - 0.5) * SPREAD_RANGE;
					return new THREE.Vector3(x, y, z);
				}

				// Loop to create and add 100 curves to the scene
				for (let i = 0; i < CURVE_COUNT; i++) {
					// A cubic Bézier curve requires 4 points: start, control 1, control 2, end
					const startPoint = getRandomPoint();
					const controlPoint1 = getRandomPoint();
					const controlPoint2 = getRandomPoint();
					const endPoint = getRandomPoint();

					// Create the curve object
					const curve = new THREE.CubicBezierCurve3(
						startPoint,
						controlPoint1,
						controlPoint2,
						endPoint
					);

					// To visualize the curve, we get a series of points from it
					// Get the total length of this specific curve
					const totalLength = curve.getLength();

					// Get 51 points evenly spaced by distance along the curve
					const points = curve.getSpacedPoints(POINTS_PER_CURVE - 1);

					// Loop through the 51 points to fill the texture data array
					for (let j = 0; j < POINTS_PER_CURVE; j++) {
						const point = points[j];

						// Calculate the index in the flat data array
						const index = (i * POINTS_PER_CURVE + j) * 4;

						// Store x, y, z in the R, G, B channels
						textureData[index + 0] = point.x;
						textureData[index + 1] = point.y;
						textureData[index + 2] = point.z;
						// Store the total curve length in the W (alpha) channel
						textureData[index + 3] = totalLength;
					}
					const geometry = new THREE.BufferGeometry().setFromPoints(points);

					const color = new THREE.Color(Math.random() * 0xffffff);

					// Create a material with a random color for each line
					// const material = new THREE.LineBasicMaterial({
					// 	color: color,
					// });

					curveMetadataTextureData[i * 4] = totalLength;

					// Create the final line object and add it to the scene
					// const curveObject = new THREE.Line(geometry, material);
					// scene.add(curveObject);
				}

				for (let i = 0; i < snakeCounts; i++) {
					let lengthSoFar = 0;
					for (let index = 0; index < max_segment_count; index++) {
						const flatIndex = ((i * max_segment_count) + index) * 4;
						const randomRowInSnakePath = Math.floor(
							(CURVE_COUNT ) * Math.random()
						);
						snakePathsCurveMetadataTextureData[
							flatIndex
						] = randomRowInSnakePath; //store segment id
						snakePathsCurveMetadataTextureData[
							flatIndex + 1
						] = curveMetadataTextureData[randomRowInSnakePath * 4]; //store segment length
						lengthSoFar += curveMetadataTextureData[randomRowInSnakePath * 4];
						snakePathsCurveMetadataTextureData[
							flatIndex + 2
						] = lengthSoFar; //store segment end
						snakePathsCurveMetadataTextureData[
							flatIndex + 3
						] = Math.random() > 0.5 ? 1 : -1; //store segment direction
					}

					//metadata for the snake aka color + full length of the path
					const randomColor = new THREE.Color(Math.random() * 0xffffff);
					snakesMetadata[i * 4] = randomColor.r; // R
					snakesMetadata[i * 4 + 1] = randomColor.g; // G
					snakesMetadata[i * 4 + 2] = randomColor.b; // B
					snakesMetadata[i * 4 + 3] = lengthSoFar; // A
					snakePathLengths[i] = lengthSoFar;
				}

				for (let i = 0; i < particleCount; i++) {
					const snakeId = particleIDs[i] // random snake id
					const snakePathTotalLength = snakesMetadata[snakeId * 4 + 3]; // total length of the snake path
					// positions[i * 3 + 2] = positions[i * 3 + 2] * snakePathTotalLength; // progress offset within the snake
					snakePathLengths[i] = snakePathTotalLength;
				}

				geoPoints.setAttribute(
					"position",
					new THREE.BufferAttribute(positions, 3).setUsage(
						THREE.DynamicDrawUsage
					)
				);

				offsetInSnakeBuffer = new THREE.BufferAttribute(offsetInSnake, 1).setUsage(
					THREE.DynamicDrawUsage
				);
				
				staticIdBuffer = new THREE.BufferAttribute(particleIDs, 1).setUsage(
					THREE.DynamicDrawUsage
				)
				staticIdBuffer.gpuType = THREE.IntType;
				staticIdBuffer.needsUpdate = true;

				snakePathLengthBuffer = new THREE.BufferAttribute(snakePathLengths, 1).setUsage(
					THREE.DynamicDrawUsage
				)
				snakePathLengthBuffer.needsUpdate = true;

				geoPoints.setAttribute(
					"snakeId",
					staticIdBuffer
				); // static snake id buffer

				const pointsShader = new THREE.ShaderMaterial({
					// glslVersion: THREE.GLSL3,
					uniforms: {
						uCurveTexture: { value: null },
						uSnakesMetadataTexture: { value: null },
						uRadius: { value: 0.32 },
						uThickness: { value: 0.22 },
						uGlowBlurRadius: { value: 0.09 },
						uGlowStartAlpha: { value: 0.74 }
					},
					vertexShader: document
						.getElementById("vertexShaderParticles")
						.textContent.trim(),
					fragmentShader: document
						.getElementById("fragmentShaderParticles")
						.textContent.trim(),
					transparent: true,
				});

				// points = new THREE.Points(geoPoints, pointsShader);
				// points.frustumCulled = false;
				// pointsShader.depthWrite = false;
				// scene.add(points);
				const particleState = new Int32Array(particleCount);
				const pointsBufferAttribute = new THREE.BufferAttribute(particleState, 1).setUsage(
					THREE.DynamicDrawUsage
				)
				pointsBufferAttribute.gpuType = THREE.IntType;
				pointsBufferAttribute.needsUpdate = true;
				tf_writeBuffer = pointsBufferAttribute
				tf_readBuffer = tf_writeBuffer.clone();

				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				// Setup TF reference
				const gl = renderer.getContext();
				feedback = gl.createTransformFeedback();

				positionBuffer = instancedGeometry.getAttribute("instancePosition");
				positionBufferBis = positionBuffer.clone();
				quaternionBuffer = instancedGeometry.getAttribute("instanceQuaternion");

				renderer.attributes.update(positionBuffer, gl.ARRAY_BUFFER);
				renderer.attributes.update(positionBufferBis, gl.ARRAY_BUFFER);
				renderer.attributes.update(quaternionBuffer, gl.ARRAY_BUFFER);
				renderer.attributes.update(tf_readBuffer, gl.ARRAY_BUFFER);
				renderer.attributes.update(tf_writeBuffer, gl.ARRAY_BUFFER);
				renderer.attributes.update(staticIdBuffer, gl.ARRAY_BUFFER);
				renderer.attributes.update(offsetInSnakeBuffer, gl.ARRAY_BUFFER);
				renderer.attributes.update(snakePathLengthBuffer, gl.ARRAY_BUFFER);

				// Setup Compute Shader
				const vertSrc = document
					.getElementById("vertexShader")
					.textContent.trim();
				const fragSrc = document
					.getElementById("fragmentShader")
					.textContent.trim();

				computeShader = new GLShader(gl);
				computeShader.compile(vertSrc, fragSrc, ["outState","outPosition","outQuaternion"]);
				computeShader.useUniforms([
					"time",
					"count",
					"uCurveTexture",
					"uMaxCurves",
					"uCameraPosition",
					"uCurveMetadataTexture",
					"uSnakesTexture",
					"uSnakesMetadataTexture"
				]);

				curveTexture = new THREE.DataTexture(
					textureData,
					POINTS_PER_CURVE, // width
					CURVE_COUNT, // height
					THREE.RGBAFormat, // format (R,G,B,A)
					THREE.FloatType // type (important for precision)
				);
				curveTexture.minFilter = THREE.LinearFilter;
				curveTexture.magFilter = THREE.LinearFilter;

				curveMetadataTexture = new THREE.DataTexture(
					curveMetadataTextureData,
					1, // width
					CURVE_COUNT, // height
					THREE.RGBAFormat, // format (R,G,B,A)
					THREE.FloatType // type (important for precision)
				);
				curveMetadataTexture.minFilter = THREE.NearestFilter;
				curveMetadataTexture.magFilter = THREE.NearestFilter;

				snakesTexture = new THREE.DataTexture(
					snakePathsCurveMetadataTextureData,
					max_segment_count, // width
					snakeCounts, // height
					THREE.RGBAFormat, // format (R,G,B,A)
					THREE.FloatType // type (important for precision)
				);
				snakesTexture.minFilter = THREE.NearestFilter;
				snakesTexture.magFilter = THREE.NearestFilter;

				snakesMetadataTexture = new THREE.DataTexture(
					snakesMetadata,
					1, // width
					snakeCounts, // height
					THREE.RGBAFormat, // format (R,G,B,A)
					THREE.FloatType // type (important for precision)
				);
				snakesMetadataTexture.minFilter = THREE.NearestFilter;
				snakesMetadataTexture.magFilter = THREE.NearestFilter;

				// We need to tell three.js to update the texture to the GPU
				curveTexture.needsUpdate = true;
				curveMetadataTexture.needsUpdate = true;
				snakesTexture.needsUpdate = true;
				snakesMetadataTexture.needsUpdate = true;

				pointsShader.uniforms.uSnakesMetadataTexture.value = snakesMetadataTexture;
				pointsShader.uniforms.uCurveTexture.value = curveTexture;

				pointsShader.needsUpdate = true;

				// Disable mipmaps and use nearest-neighbor filtering for exact data lookup

				renderer.initTexture(curveTexture);
				renderer.initTexture(curveMetadataTexture);
				renderer.initTexture(snakesTexture);
				renderer.initTexture(snakesMetadataTexture);
			}

			let iteration = 0;
			function compute(et) {
				iteration++;

				// console.log('compute', instMesh.instanceMatrix)

				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				// Alias
				const rend = renderer;

				// GL Buffers don't exist until after the first frame render
				// Skip frame if the gl buffer for instanceMatrix doesn't exist
				// Get the underlying WebGLBuffers from the THREE attributes
				const isPairIteration = iteration % 2 === 0;
				const readBufferInfo = isPairIteration
					? rend.attributes.get(tf_readBuffer)
					: rend.attributes.get(tf_writeBuffer);
				const writeBufferInfo = isPairIteration
					? rend.attributes.get(tf_writeBuffer)
					: rend.attributes.get(tf_readBuffer);
				const readPositionBufferInfo = isPairIteration
					? rend.attributes.get(positionBuffer)
					: rend.attributes.get(positionBufferBis)
				const writePositionBufferInfo = isPairIteration
					? rend.attributes.get(positionBufferBis)
					: rend.attributes.get(positionBuffer);

				const quaternionBufferInfo = rend.attributes.get(quaternionBuffer);

				const webglState = renderer.state

				// Skip frame if the gl buffers don't exist yet
				if (!writeBufferInfo) return;

				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				// Looks like 3JS leaves VAOs bound after rendering
				// This breaks buffer binding for transform feedback
				// SOOO... Make sure there are no VAO bound before running TF
				const gl = rend.getContext();
				gl.bindVertexArray(null);

				// For extra protection, lets just unbind array buffers too
				// Doesn't seem needed but since VAO was an issue, lets do this too.
				gl.bindBuffer(gl.ARRAY_BUFFER, null);

				// =================================================================
				// == ATTENTION: ADD THIS SECTION TO BIND YOUR INPUT BUFFER       ==
				// =================================================================

				// 1. Create and bind a VAO to store the input attribute configuration.
				const vao = gl.createVertexArray();
				gl.bindVertexArray(vao);

				// 2. Bind your READ buffer to the ARRAY_BUFFER target.
				gl.bindBuffer(gl.ARRAY_BUFFER, readBufferInfo.buffer);
				gl.vertexAttribIPointer(0, 1, gl.INT, 0, 0);
				gl.enableVertexAttribArray(0);

				const idBufferInfo = rend.attributes.get(staticIdBuffer); // Get the WebGLBuffer
				gl.bindBuffer(gl.ARRAY_BUFFER, idBufferInfo.buffer);
				gl.vertexAttribIPointer(1, 1, gl.INT, 0, 0); // Setup attribute pointer at location 1
				gl.enableVertexAttribArray(1);

				const snakeBufferInfo = rend.attributes.get(snakePathLengthBuffer); // Get the WebGLBuffer
				gl.bindBuffer(gl.ARRAY_BUFFER, snakeBufferInfo.buffer);
				gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0); // Setup attribute pointer at location 1
				gl.enableVertexAttribArray(2);

				const offsetInSnakeBufferInfo = rend.attributes.get(offsetInSnakeBuffer); // Get the WebGLBuffer
				gl.bindBuffer(gl.ARRAY_BUFFER, offsetInSnakeBufferInfo.buffer);
				gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 0, 0); // Setup attribute pointer at location 3
				gl.enableVertexAttribArray(3);

				gl.bindBuffer(gl.ARRAY_BUFFER, readPositionBufferInfo.buffer);
				gl.vertexAttribPointer(4, 3, gl.FLOAT, false, 0, 0); // Setup attribute pointer at location 4
				gl.enableVertexAttribArray(4);

				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				// 5 BIND THE DATA TEXTURE
				const textureUnit = 0; // Use texture unit 0
				webglState.bindTexture(gl.TEXTURE_2D, rend.properties.get(curveTexture).__webglTexture, gl.TEXTURE0 + textureUnit)
				
				const textureUnit2 = 1;
				webglState.bindTexture(gl.TEXTURE_2D, rend.properties.get(curveMetadataTexture).__webglTexture, gl.TEXTURE0 + textureUnit2)

				const textureUnit3 = 2;
				webglState.bindTexture(gl.TEXTURE_2D, rend.properties.get(snakesTexture).__webglTexture, gl.TEXTURE0 + textureUnit3)

				const textureUnit4 = 3;
				webglState.bindTexture(gl.TEXTURE_2D, rend.properties.get(snakesMetadataTexture).__webglTexture, gl.TEXTURE0 + textureUnit4)

		
				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				// Setup Shader
				gl.useProgram(computeShader.prog); // Turn on shader
				gl.uniform1i(computeShader.uniforms.uCurveTexture, textureUnit);
				gl.uniform1i(
					computeShader.uniforms.uCurveMetadataTexture,
					textureUnit2
				);
				gl.uniform1i(computeShader.uniforms.uSnakesTexture, textureUnit3);
				gl.uniform1i(computeShader.uniforms.uSnakesMetadataTexture, textureUnit4);
				gl.uniform1f(computeShader.uniforms.time, et); // Set Float Uniforms
				gl.uniform1f(computeShader.uniforms.count, particleCount);
				gl.uniform1f(computeShader.uniforms.uMaxCurves, CURVE_COUNT);
				gl.uniform3f(
					computeShader.uniforms.uCameraPosition,
					camera.position.x,
					camera.position.y,
					camera.position.z
				);

				gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, feedback); // Bind TransformFeedback
				gl.enable(gl.RASTERIZER_DISCARD); // Disable fragment shader, its not needed

				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				// Bind the output buffer, which is the instance matrix
				gl.bindBufferBase(
					gl.TRANSFORM_FEEDBACK_BUFFER,
					0,
					writeBufferInfo.buffer
				);
				gl.bindBufferBase(
					gl.TRANSFORM_FEEDBACK_BUFFER,
					1,
					writePositionBufferInfo.buffer
				);
				gl.bindBufferBase(
					gl.TRANSFORM_FEEDBACK_BUFFER,
					2,
					quaternionBufferInfo.buffer
				);

				// Run compute shader. Special care is needed to manipulate a MAT4 buffer.
				// TransformFeedback has a hard limit of 4 floats per output but Mat4 has 16
				// We can work around this by breaking down the matrix by sets of four Vec4s
				// In the compute shader we determine which Vec4 row of the instance its working
				// on and set the correct value for that row in the matrix.
				gl.beginTransformFeedback(gl.POINTS); // Execute as 1 vector at a time linearly
				gl.drawArrays(gl.POINTS, 0, particleCount); // 1 vec3 per point
				gl.endTransformFeedback();

				// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
				gl.disable(gl.RASTERIZER_DISCARD); // Turn back on Fragment shaders
				gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null); // Turn off Transform feedback
				gl.useProgram(null); // Turn off shader

				// ----- ADD THIS FULL STATE RESET -----
				gl.bindVertexArray(null);

				instancedGeometry.setAttribute('instancePosition', isPairIteration
					? positionBufferBis
					: positionBuffer);


				// renderer.resetState();
			}

			// #endregion

			// #region GL HELPERS
			class GLShader {
				// #region MAIN
				constructor(gl) {
					this.gl = gl;
					this.prog = null;
					this.uniforms = {};
				}

				dispose() {
					if (this.prog) this.gl.deleteProgram(this.prog);
					this.gl = null;
				}
				// #endregion

				// #region METHODS
				compile(vSrc, fSrc, tfVarying = null) {
					// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
					// Compile Shader
					const vSh = this._compileShader(vSrc, true);
					if (!vSh) return false;

					const fSh = this._compileShader(fSrc, false);
					if (!fSh) {
						this.gl.deleteShader(vSh);
						return false;
					}

					// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
					this.prog = this._linkProgram(vSh, fSh, tfVarying);
					return !!this.prog;
				}

				useUniforms(ary) {
					for (const i of ary) {
						this.uniforms[i] = this.gl.getUniformLocation(this.prog, i);
					}

					return this;
				}
				// #endregion

				// #region HELPERS
				_compileShader(src, isVert = true) {
					const sh = this.gl.createShader(
						isVert ? this.gl.VERTEX_SHADER : this.gl.FRAGMENT_SHADER
					);

					this.gl.shaderSource(sh, src);
					this.gl.compileShader(sh);

					if (!this.gl.getShaderParameter(sh, this.gl.COMPILE_STATUS)) {
						console.log(
							"SHADER COMPILE ERROR - isVert: ",
							isVert,
							"MSG: ",
							this.gl.getShaderInfoLog(sh)
						);
						this.gl.deleteShader(sh);
						return null;
					}

					return sh;
				}

				_linkProgram(vSh, fSh, tfVarying = null) {
					// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
					// Build Program
					const prog = this.gl.createProgram();
					this.gl.attachShader(prog, vSh);
					this.gl.attachShader(prog, fSh);

					if (tfVarying) {
						// Define shader TF outputs
						this.gl.transformFeedbackVaryings(
							prog,
							tfVarying,
							this.gl.SEPARATE_ATTRIBS
						);
					}

					this.gl.linkProgram(prog);

					// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
					// Cleanup
					this.gl.detachShader(prog, vSh);
					this.gl.detachShader(prog, fSh);
					this.gl.deleteShader(vSh);
					this.gl.deleteShader(fSh);

					// ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
					// Validate
					if (!this.gl.getProgramParameter(prog, this.gl.LINK_STATUS)) {
						console.log("LINK ERROR", this.gl.getProgramInfoLog(prog));
						this.gl.deleteProgram(prog);
						return null;
					}

					return prog;
				}
				// #endregion
			}
			// #endregion
		</script>
	</body>
