<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js webgl - transformfeedback - refactored</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <link type="text/css" rel="stylesheet" href="main.css" />
    <style>
        body { margin: 0; }
    </style>
</head>
<body>
    <div id="container"></div>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "../build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from "three";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import Stats from "three/addons/libs/stats.module.js";
        import { TransformFeedbackSystem } from './TransformFeedbackSystem.js'; // <-- IMPORT THE NEW CLASS

        let container, stats, camera, scene, renderer, controls;
        let transformFeedbackSystem;
        const clock = new THREE.Clock();

        function init() {
            container = document.getElementById('container');

            // --- Basic Scene Setup ---
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 50, 200);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x151515);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            stats = new Stats();
            container.appendChild(stats.dom);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.update();

            scene.add(new THREE.GridHelper(200, 20, 0x0c610c, 0x494949));

            // --- Initialize Transform Feedback System ---
            transformFeedbackSystem = new TransformFeedbackSystem(renderer, {
                 particleCount: 10000, // Example: Increase particle count
                 snakeCount: 2,
                 curveCount: 1000,
            });
            transformFeedbackSystem.init();
            scene.add(transformFeedbackSystem.mesh); // Add the system's mesh to the scene

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            stats.update();
            controls.update();

            // --- Update the system every frame ---
            if (transformFeedbackSystem) {
                transformFeedbackSystem.update(clock.getElapsedTime(), camera);
            }

            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
